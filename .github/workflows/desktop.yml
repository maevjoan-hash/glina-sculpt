# Builds the desktop apps (Electron) for Linux and Windows from the offline single-file app
# and attaches them to the release on tags v*.
name: desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:        # run by release.yml
    inputs:
      release_tag:        # the draft release the files go to
        type: string
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            script: dist:linux
            files: |
              desktop/out/*.AppImage
              desktop/out/*.deb
          - os: windows-latest   # native build, so the installer and the .exe get their icon without Wine
            platform: windows
            script: dist:win
            files: |
              desktop/out/Glina-Setup-*.exe
              desktop/out/*-portable.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # npm install scripts must not see a write token
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            build/package-lock.json
            desktop/package-lock.json

      - name: Build the offline web app (dist/glina.html)
        working-directory: build
        run: |
          npm ci
          node build.mjs

      - name: Install the desktop build tools
        working-directory: desktop
        run: npm ci

      - name: Build the desktop packages
        working-directory: desktop
        run: |
          # version: from a tag v1.2.3, otherwise from build/package.json (shared with web and Android)
          v="${GITHUB_REF_NAME#v}"
          if ! [[ "$GITHUB_REF" == refs/tags/v* && "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            v="$(node -p "require('../build/package.json').version")"
          fi
          args=("-c.extraMetadata.version=$v")
          npm run ${{ matrix.script }} -- "${args[@]}"
          ls -l out

      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        working-directory: desktop
        run: node test/smoke.mjs --exe out/win-unpacked/Glina.exe

      # the real installer, the way people get it: first the last released one, then this one over it
      # (an update), silently; the installed app must then pass the same smoke test
      - name: Installer, as a fresh install and as an update (Windows)
        if: matrix.platform == 'windows'
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\Glina"
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          if ($tag) {
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern 'Glina-Setup-*.exe' --dir prev
            $old = (Get-ChildItem prev\Glina-Setup-*.exe | Select-Object -First 1).FullName
            $p = Start-Process -Wait -PassThru -FilePath $old -ArgumentList '/S'
            "previous ($tag) installer exit code: $($p.ExitCode)"
            if (Test-Path "$dir\Glina.exe") { "previous installed: " + (Get-Item "$dir\Glina.exe").VersionInfo.ProductVersion }
          }
          $new = (Get-ChildItem out\Glina-Setup-*.exe | Select-Object -First 1).FullName
          "new installer: $new"
          $p = Start-Process -Wait -PassThru -FilePath $new -ArgumentList '/S'
          "new installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "the installer failed (exit code $($p.ExitCode))" }
          if (!(Test-Path "$dir\Glina.exe")) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 1 | Format-Table FullName; throw "nothing installed in $dir" }
          $v = (Get-Item "$dir\Glina.exe").VersionInfo.ProductVersion
          "installed version: $v"
          $want = node -p "require('../build/package.json').version"
          if ($v -notlike "$want*") { throw "the update left version $v, not $want" }
          $lnk = Get-ChildItem "$env:USERPROFILE\Desktop", "$env:PUBLIC\Desktop" -Filter '*.lnk' -ErrorAction SilentlyContinue
          "desktop shortcuts: " + ($lnk.Name -join ', ')
          node test/smoke.mjs --exe "$dir\Glina.exe"

      - name: Smoke test (Linux, headless)
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: |
          # Ubuntu 24.04 blocks unprivileged user namespaces, which Chromium's sandbox needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a -s "-screen 0 1920x1080x24" node test/smoke.mjs

      # Pushes to main only build and test. A manual run keeps its files for a day in Artifacts; a release
      # run puts them straight into its draft release (the private repository has 500 MB of artifact storage)
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release_tag && (github.ref != 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        with:
          retention-days: 1
          name: glina-desktop-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Upload to the draft release
        if: ${{ inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FILES: ${{ matrix.files }}
        run: gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
