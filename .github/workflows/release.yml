# Publishes a GitHub Release with every build of Глина.
# To release: set the version in build/package.json, then push that commit to the `release` branch:
#   git push origin main:release
# It makes a draft release v<version>, runs the web, desktop and Android workflows, which put their
# files into the draft, and publishes it (creating the tag) only when all of them pass. A version that
# is already released is refused; a draft left by a failed run is replaced.
name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # npm install scripts must not see a write token
      - name: Draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./build/package.json').version")"
          TAG="v$VERSION"
          # published releases only (this endpoint does not return drafts)
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent > /dev/null 2>&1; then
            echo "::error::$TAG is already released. Raise the version in build/package.json first."
            exit 1
          fi
          # a draft from an earlier, failed run: start again (a draft has no tag yet)
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          cat > notes.md <<EOF
          Безплатно 3D скулптиране със стилус. Работи изцяло без интернет.

          | Система | Файл |
          |---|---|
          | Windows (инсталатор) | \`Glina-Setup-$VERSION-x64.exe\` |
          | Windows (без инсталиране) | \`Glina-$VERSION-x64-portable.exe\` |
          | Linux | \`Glina-$VERSION-x86_64.AppImage\` или \`glina_${VERSION}_amd64.deb\` |
          | Android | \`Glina-$VERSION-debug.apk\` |
          | Всяка система, в браузъра | \`Glina-offline.html\` (един файл) или \`Glina-web-app.zip\` (за инсталиране като уеб приложение) |

          Windows може да покаже предупреждение „Windows защити компютъра ви“, защото файлът не е подписан: „Повече информация“ → „Изпълни въпреки това“.
          На Android разрешете „Инсталиране от неизвестни източници“ за браузъра или файловия мениджър.
          EOF
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Глина $VERSION" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  web:
    needs: prepare
    uses: ./.github/workflows/web.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
  desktop:
    needs: prepare
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
  android:
    needs: prepare
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, web, desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish ${{ needs.prepare.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"'
          n=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          if [ "$n" -lt 7 ]; then echo "::error::the draft has $n files, expected 7"; exit 1; fi
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "::notice title=Released::$TAG with $n files"
