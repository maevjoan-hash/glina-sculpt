# Publishes a GitHub Release with every build of Глина.
# To release: set the version in build/package.json, then push that commit to the `release` branch:
#   git push origin main:release
# This runs the web, desktop and Android workflows; when all of them pass it creates the tag
# v<version> and the release with all the files. A version that is already released is refused.
name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  web:
    uses: ./.github/workflows/web.yml
    secrets: inherit
  desktop:
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    needs: [web, desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # npm install scripts must not see a write token
      - name: Version
        id: version
        run: echo "version=$(node -p "require('./build/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Stop if this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::v$VERSION is already released. Raise the version in build/package.json first."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - run: ls -l files
      - name: Release v${{ steps.version.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Глина ${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          files: files/*
          body: |
            Безплатно 3D скулптиране със стилус. Работи изцяло без интернет.

            | Система | Файл |
            |---|---|
            | Windows (инсталатор) | `Glina-Setup-${{ steps.version.outputs.version }}-x64.exe` |
            | Windows (без инсталиране) | `Glina-${{ steps.version.outputs.version }}-x64-portable.exe` |
            | Linux | `Glina-${{ steps.version.outputs.version }}-x86_64.AppImage` или `glina_${{ steps.version.outputs.version }}_amd64.deb` |
            | Android | `Glina-${{ steps.version.outputs.version }}-debug.apk` |
            | Всяка система, в браузъра | `Glina-offline.html` (един файл) или `Glina-web-app.zip` (за инсталиране като уеб приложение) |

            Windows може да покаже предупреждение „Windows защити компютъра ви“, защото файлът не е подписан: „Повече информация“ → „Изпълни въпреки това“.
            На Android разрешете „Инсталиране от неизвестни източници“ за браузъра или файловия мениджър.
