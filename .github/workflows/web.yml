# Builds the offline single-file app and the installable web app (PWA) and attaches them to releases.
name: web

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:        # run by release.yml

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # npm install scripts must not see a write token
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/package-lock.json
      - name: Build offline versions
        working-directory: build
        run: |
          npm ci
          node build.mjs
      - name: Pack the web app
        run: |
          cp dist/glina.html Glina-offline.html
          (cd dist/web && zip -r ../../Glina-web-app.zip .)
      # the files are only kept for a release (1 day: the release has them after that); pushes to main
      # just build and test, so the private repository's 500 MB of artifact storage does not fill up
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          retention-days: 1
          name: glina-web
          path: |
            Glina-offline.html
            Glina-web-app.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Glina-offline.html
            Glina-web-app.zip
