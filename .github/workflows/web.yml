# Builds the offline single-file app and the installable web app (PWA) and attaches them to releases.
name: web

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:        # run by release.yml
    inputs:
      release_tag:        # the draft release the files go to
        type: string
        default: ''

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # npm install scripts must not see a write token
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/package-lock.json
      - name: Build offline versions
        working-directory: build
        run: |
          npm ci
          node build.mjs
      - name: Pack the web app
        run: |
          cp dist/glina.html Glina-offline.html
          (cd dist/web && zip -r ../../Glina-web-app.zip .)
      # Pushes to main only build and test. A manual run keeps its files for a day in Artifacts; a release
      # run puts them straight into its draft release (the private repository has 500 MB of artifact storage)
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release_tag && (github.ref != 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        with:
          retention-days: 1
          name: glina-web
          path: |
            Glina-offline.html
            Glina-web-app.zip
      - name: Upload to the draft release
        if: ${{ inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" Glina-offline.html Glina-web-app.zip --clobber --repo "$GITHUB_REPOSITORY"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Glina-offline.html
            Glina-web-app.zip
