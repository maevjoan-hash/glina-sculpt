# Builds the Android app (Capacitor, folder android/): a debug APK on every run, and a signed
# release APK + AAB when the signing secrets are set. Attaches them to the GitHub release on tags v*.
#
# Release signing (optional): Settings > Secrets and variables > Actions > New repository secret.
# Set all four, or none (then only the debug APK is built):
#   ANDROID_KEYSTORE_BASE64    the keystore file in base64:  base64 -w0 glina-release.jks
#   ANDROID_KEYSTORE_PASSWORD  the keystore password
#   ANDROID_KEY_ALIAS          the key alias inside the keystore (e.g. glina)
#   ANDROID_KEY_PASSWORD       the key password (the same as the keystore password for PKCS12 keystores)
# How to make the keystore: android/README.md.
name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:        # run by release.yml

permissions:
  contents: write

jobs:
  android:
    # pinned: ubuntu-latest is moving to Ubuntu 26, where the Android setup failed (Oct 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            build/package-lock.json
            android/package-lock.json

      - name: Build the web app (dist/web)
        working-directory: build
        run: |
          npm ci
          node build.mjs

      - name: Copy it into the Android project (www -> cap sync)
        working-directory: android
        run: |
          npm ci
          npm run sync

      # the exact Chromium build that playwright-core is made for, not whatever Chrome the runner has
      - name: Install Chromium for the test
        working-directory: android
        run: npx playwright-core install --with-deps chromium

      - name: Test export and the Capacitor bridge in Chrome
        working-directory: android
        run: npm test

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p "require('./build/package.json').version")"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Глина $v"

      # Capacitor 8 compiles with Java 21 (capacitor.build.gradle: JavaVersion.VERSION_21)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK: the runner image normally has one; otherwise fetch Google's command-line tools.
      # AGP downloads any missing platform or build-tools itself once the licences are accepted.
      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # Gradle cache; also checks gradle-wrapper.jar against the official checksums
      - uses: gradle/actions/setup-gradle@v4

      # the debug key lives in ~/.android/debug.keystore; keeping it between runs lets a newer
      # debug APK install over an older one (otherwise Android refuses: different signature)
      - name: Keep the debug signing key between runs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: glina-android-debug-keystore

      - name: Build the debug APK
        working-directory: android/android
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PglinaVersion="$VERSION"

      - name: Build the signed release APK and AAB
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: android/android
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GLINA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GLINA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GLINA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export GLINA_KEYSTORE_FILE="$RUNNER_TEMP/glina-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GLINA_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease bundleRelease -PglinaVersion="$VERSION"
          rm -f "$GLINA_KEYSTORE_FILE"

      - name: Collect and check the files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          outputs=android/android/app/build/outputs
          find "$outputs" -type f \( -name '*.apk' -o -name '*.aab' \) | sort
          debug=$(find "$outputs/apk" -type f -name '*debug*.apk' | head -n 1)
          if [ -z "$debug" ]; then echo "::error::no debug APK under $outputs"; exit 1; fi
          cp "$debug" "out/Glina-$VERSION-debug.apk"
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            cp "$(find "$outputs/apk" -type f -name '*release*.apk' | head -n 1)" "out/Glina-$VERSION.apk"
            cp "$(find "$outputs/bundle" -type f -name '*release*.aab' | head -n 1)" "out/Glina-$VERSION.aab"
          fi
          # a short report, also as notices (they show on the run page)
          bt="$ANDROID_HOME/build-tools"
          tools="$bt/$(ls "$bt" | sort -V | tail -n 1)"
          for apk in out/*.apk; do
            echo "::notice title=$(basename "$apk")::$(stat -c %s "$apk") bytes"
            "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/sig.txt" 2>&1 || echo "::warning title=$(basename "$apk")::apksigner verify failed"
            grep -E '^Verifies|^Verified using v[0-9]|certificate DN|certificate SHA-256' "$RUNNER_TEMP/sig.txt" | while read -r line; do echo "::notice title=$(basename "$apk") signature::$line"; done || true
            "$tools/aapt2" dump badging "$apk" 2>&1 | grep -E "^package:|^application-label:|^sdkVersion:|^targetSdkVersion:" | while read -r line; do echo "::notice title=$(basename "$apk")::$line"; done || true
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: glina-android
          path: out/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
