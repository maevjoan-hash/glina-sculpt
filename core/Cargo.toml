[package]
name = "glina-core"
version = "0.1.0"
edition = "2021"
description = "The heavy geometry of Глина (voxel remesh and booleans), built to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
