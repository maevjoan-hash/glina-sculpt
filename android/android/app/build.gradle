apply plugin: 'com.android.application'

// Version of Глина: the one in build/package.json, shared with the web and desktop builds.
// versionCode follows from it (1.2.3 -> 10203), so a newer version always installs over an older one.
// Both can be overridden: ./gradlew assembleDebug -PglinaVersion=1.2.3 -PglinaVersionCode=10203
def glinaVersion = (findProperty('glinaVersion') ?: {
    def pkg = new File(rootProject.projectDir, '../../build/package.json')
    pkg.exists() ? new groovy.json.JsonSlurper().parse(pkg).version : '1.0.0'
}()).toString()
def glinaVersionCode = (findProperty('glinaVersionCode') ?: {
    // minor and patch may be missing: 1.2 -> 10200, 2 -> 20000
    def m = (glinaVersion =~ /^(\d+)(?:\.(\d+))?(?:\.(\d+))?/)
    m.find() ? m.group(1).toInteger() * 10000 + (m.group(2) ?: '0').toInteger() * 100 + (m.group(3) ?: '0').toInteger() : 1
}()).toString().toInteger()

// Release signing, only when a keystore is given: in GitHub Actions from the repository secrets
// (see .github/workflows/android.yml), locally from environment variables or ~/.gradle/gradle.properties
// (glinaKeystoreFile, glinaKeystorePassword, glinaKeyAlias, glinaKeyPassword). Without them
// assembleRelease still works but gives an unsigned APK; assembleDebug never needs them.
def releaseKey = [
    storeFile    : System.getenv('GLINA_KEYSTORE_FILE') ?: findProperty('glinaKeystoreFile'),
    storePassword: System.getenv('GLINA_KEYSTORE_PASSWORD') ?: findProperty('glinaKeystorePassword'),
    keyAlias     : System.getenv('GLINA_KEY_ALIAS') ?: findProperty('glinaKeyAlias'),
    keyPassword  : System.getenv('GLINA_KEY_PASSWORD') ?: findProperty('glinaKeyPassword'),
]
def canSignRelease = releaseKey.values().every { it }

android {
    namespace = "bg.glina.sculpt"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "bg.glina.sculpt"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode glinaVersionCode
        versionName glinaVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // one fixed debug key, kept in the repository (it is not secret: it only signs test builds),
        // so every debug APK installs over the previous one, whichever machine or CI run built it
        debug {
            storeFile file('glina-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (canSignRelease) {
            release {
                storeFile file(releaseKey.storeFile)
                storePassword releaseKey.storePassword
                keyAlias releaseKey.keyAlias
                keyPassword releaseKey.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
